server:
  port: ${PORT:8080}

  scalar:
    url: ${SERVER_URL:localhost://8080}/v3/api-docs
    path: /docs
    enabled: true

app:
  security:
    jwt:
      connect-timeout: ${JWT_JWK_CONNECT_TIMEOUT:5s}
      read-timeout: ${JWT_JWK_READ_TIMEOUT:30s}
    # Base64-encoded 32-byte AES key that encrypts secrets saved from the admin
    # console. Without it the console cannot store an API key at all, and says
    # so, rather than writing one in the clear. Generate with:
    #   openssl rand -base64 32
    settings-encryption-key: ${AI_SETTINGS_ENCRYPTION_KEY:}

spring:
  autoconfigure:
    # The starter builds a Gemini client at startup from these properties and
    # refuses a blank key. Nothing injects that client any more — every AI call
    # goes through AiChatClientFactory, which builds one from the settings that
    # are live at the time — and excluding it is what lets the server start with
    # no key at all so an administrator can set one from the console.
    exclude:
      - org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatAutoConfiguration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}
  application:
    name: ai_interview_backend_api
  servlet:
    multipart:
      # Defaults are 1MB/10MB, which would reject the 5MB files the upload
      # endpoint is meant to accept. Headroom left for the multipart envelope.
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:6MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:8MB}
  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER}
    password: ${DB_PASS}
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}

  jpa:
    hibernate:
      # Flyway owns the schema; this is the safety net, not the plan. Set
      # DDL_AUTO=validate on a deployed server once a boot has succeeded: the
      # server then refuses to start on a schema the migrations did not produce,
      # instead of quietly issuing DDL of its own and failing halfway through
      # against real data.
      ddl-auto: ${DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    # An existing database that predates Flyway is stamped as version 1 rather
    # than being rebuilt, so migrations from V2 on apply to what is already
    # there. Every migration is written to be safe against a schema ddl-auto
    # built, because for a long time that is the only thing that built it.
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  ai:
    google:
      genai:
        # Bootstrap values only. The admin console can override the model, the
        # key and the tuning at runtime (stored in system_settings); these are
        # what the platform falls back to when it has not. Blank is allowed so a
        # deployment can hold its key in the console instead of the environment.
        api-key: ${GEMINI_API_KEY:}
        chat:
          max-output-tokens: 4096
          temperature: 0.2
          model: ${GEMINI_MODEL:gemini-3.5-flash}

vapi:
  # Shared secret Vapi presents on its webhook. Unset means the webhook rejects
  # every call, so voice interviews simply fall back to browser-side saving.
  webhook-secret: ${VAPI_WEBHOOK_SECRET:}

keycloak:
  admin:
    server-url: ${KEYCLOAK_URL}
    client-id: ${KEYCLOAK_CLIENT_ID}
    realm: master
    target-realm: ai-career
    client-secret: ${KEYCLOAK_CLIENT_SECRET}
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:ai-career}
  # Ceiling enforced by FileStorageServiceImpl; keep in step with the multipart
  # limits below, which reject oversized uploads before they reach the service.
  max-file-size: ${MINIO_MAX_FILE_SIZE:5242880}
  presigned-expiry-minutes: ${MINIO_PRESIGNED_EXPIRY_MINUTES:15}
